name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Platform and SDK
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/platform_test
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: RBAC seed is in sync with the permission matrix
        run: npm run db:seed-rbac && git diff --exit-code db/migrations/0002_rbac_seed.sql
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Migrations apply to an empty database
        run: |
          psql "$DATABASE_URL" -c "drop schema if exists platform cascade"
          npm run db:migrate
      - run: npm run build
      - name: SDK typecheck and build
        working-directory: sdks/javascript
        run: |
          ../../apps/platform/node_modules/.bin/tsc -p tsconfig.build.json
          test -f dist/index.js && test -f dist/index.d.ts
